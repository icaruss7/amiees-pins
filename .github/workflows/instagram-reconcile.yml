name: Instagram Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/instagram-reconcile.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run Instagram recovery regression tests
        run: python3 -m unittest -v test_ig_publish test_ig_native_audio

      - name: Verify all three recovery rows and public duplicate status
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 - <<'PY'
          import csv
          import json

          import ig_publish
          from ig_pipeline_media import resolve_row, apply_delivery_override

          ids = [
              "ig-exp-reel-20261029-sterling-silver-elephant-ring",
              "ig-exp-reel-20261029-dolphin-dreams-ring",
              "ig-exp-reel-20261029-blue-butterfly-hoop-earrings",
          ]
          with open("content/experiments.json", encoding="utf-8") as fh:
              registry = json.load(fh)
          with open("content/reel_delivery_overrides.json", encoding="utf-8") as fh:
              overrides = json.load(fh)["items"]
          with open("ig_queue.csv", encoding="utf-8-sig", newline="") as fh:
              queue = {row["post_id"]: row for row in csv.DictReader(fh)}

          resolved = {}
          for post_id in ids:
              row = resolve_row(queue[post_id], registry)
              row = apply_delivery_override(row, overrides[post_id])
              resolved[post_id] = row
              if not row["video_url"].startswith("https://raw.githubusercontent.com/icaruss7/amiees-pins/main/reel-media/"):
                  raise RuntimeError(f"{post_id}: recovery mirror not applied")
              if "audio_configuration" in row:
                  raise RuntimeError(f"{post_id}: failed native audio still present")
              print(post_id, "recovery_ready", row["video_sha256"], row["video_url"])

          ig_user, username = ig_publish.find_ig_user()
          media = ig_publish.call(
              "GET", f"{ig_user}/media",
              fields="id,permalink,timestamp,media_type,media_product_type,caption",
              limit=100,
          ).get("data", [])

          duplicates = {}
          for post_id, row in resolved.items():
              caption = (row.get("caption") or "").strip()
              matches = [
                  {
                      "id": item.get("id"),
                      "permalink": item.get("permalink"),
                      "timestamp": item.get("timestamp"),
                  }
                  for item in media
                  if (item.get("caption") or "").strip() == caption
              ]
              duplicates[post_id] = matches
              print(post_id, "public_matches", json.dumps(matches, sort_keys=True))
              if matches:
                  raise RuntimeError(f"{post_id}: public duplicate already exists; stop recovery")

          print("account", username, ig_user)
          print("all_three_safe_to_resume", True)
          PY
