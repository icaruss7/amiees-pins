name: Instagram Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/instagram-reconcile.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Isolate Elephant Reel media processing
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import time
          import ig_publish

          shopify = "https://cdn.shopify.com/videos/c/o/v/d4699338cbfa423391c5b467828dd2bf.mp4"
          github = "https://raw.githubusercontent.com/icaruss7/amiees-pins/main/reel-media/reel-20261029-sterling-silver-elephant-ring.mp4"
          ig_user, username = ig_publish.find_ig_user()

          def probe(label, url):
              cid = ig_publish.call(
                  "POST", f"{ig_user}/media",
                  media_type="REELS",
                  video_url=url,
                  caption="Amiees Reel media preflight",
                  share_to_feed="false",
              )["id"]
              print(label, "container", cid, flush=True)
              last = None
              for _ in range(30):
                  info = ig_publish.call("GET", cid, fields="id,status_code,status")
                  last = info
                  print(label, json.dumps(info, sort_keys=True), flush=True)
                  if info.get("status_code") in ("FINISHED", "ERROR", "EXPIRED", "PUBLISHED"):
                      break
                  time.sleep(10)
              return last

          print("account", username, ig_user)
          results = {
              "shopify_video_only": probe("shopify_video_only", shopify),
              "github_video_only": probe("github_video_only", github),
          }
          print("FINAL", json.dumps(results, sort_keys=True))
          PY
