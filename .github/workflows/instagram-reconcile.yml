name: Instagram Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/instagram-reconcile.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Isolate approved Reel options on working mirrored video
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import time
          import ig_publish
          from ig_pipeline_media import audio_configuration

          with open("content/experiments.json", encoding="utf-8") as fh:
              record = json.load(fh)["items"]["reel-20261029-sterling-silver-elephant-ring--instagram"]

          ig_user, username = ig_publish.find_ig_user()
          video = "https://raw.githubusercontent.com/icaruss7/amiees-pins/main/reel-media/reel-20261029-sterling-silver-elephant-ring.mp4"
          cover = record["queue_draft"]["media"]["cover_url"]
          audio = json.dumps(audio_configuration(record["instagram_audio"]["configuration"]))

          variants = {
              "cover_only": {"cover_url": cover},
              "audio_only": {"audio_configuration": audio},
              "ai_only": {"is_ai_generated": "true"},
          }

          containers = {}
          for label, options in variants.items():
              containers[label] = ig_publish.call(
                  "POST", f"{ig_user}/media",
                  media_type="REELS", video_url=video,
                  caption=f"Amiees Reel option preflight {label}",
                  share_to_feed="false", **options,
              )["id"]
              print(label, "container", containers[label], flush=True)

          done = {}
          for _ in range(30):
              for label, cid in containers.items():
                  if label in done:
                      continue
                  info = ig_publish.call("GET", cid, fields="id,status_code,status")
                  print(label, json.dumps(info, sort_keys=True), flush=True)
                  if info.get("status_code") in ("FINISHED", "ERROR", "EXPIRED", "PUBLISHED"):
                      done[label] = info
              if len(done) == len(containers):
                  break
              time.sleep(10)

          print("account", username, ig_user)
          print("FINAL", json.dumps(done, sort_keys=True))
          PY
