name: Instagram Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/instagram-reconcile.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify mirrored Elephant Reel with Meta without publishing
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request

          import ig_publish
          from ig_pipeline_media import audio_configuration

          raw_url = "https://raw.githubusercontent.com/icaruss7/amiees-pins/main/reel-media/reel-20261029-sterling-silver-elephant-ring.mp4"
          expected = "b35f8f2192e2f0fca6cae94efcb5399bf48557198098f1cb7a97a10050b1a6d0"

          digest = hashlib.sha256()
          with urllib.request.urlopen(raw_url, timeout=120) as response:
              while True:
                  block = response.read(1024 * 1024)
                  if not block:
                      break
                  digest.update(block)
          if digest.hexdigest() != expected:
              raise RuntimeError("Raw GitHub mirror hash mismatch")

          with open("content/experiments.json", encoding="utf-8") as fh:
              registry = json.load(fh)
          record = registry["items"]["reel-20261029-sterling-silver-elephant-ring--instagram"]
          ig_user, username = ig_publish.find_ig_user()

          options = {"cover_url": record["queue_draft"]["media"]["cover_url"]}
          options["audio_configuration"] = json.dumps(
              audio_configuration(record["instagram_audio"]["configuration"])
          )
          options["is_ai_generated"] = "true"

          parent = ig_publish.call(
              "POST", f"{ig_user}/media",
              media_type="REELS",
              video_url=raw_url,
              caption=record["caption"],
              share_to_feed="true",
              **options,
          )["id"]
          status = ig_publish.wait_ready(parent, "elephant-mirror-preflight")
          print("account:", username, ig_user)
          print("preflight_container:", parent)
          print("status:", status)
          print("published:", False)
          PY
