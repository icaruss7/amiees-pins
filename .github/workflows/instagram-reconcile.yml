name: Instagram Reconciliation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/instagram-reconcile.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Preflight exact Elephant package without failing native audio
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import time
          import ig_publish

          with open("content/experiments.json", encoding="utf-8") as fh:
              record = json.load(fh)["items"]["reel-20261029-sterling-silver-elephant-ring--instagram"]

          video = "https://raw.githubusercontent.com/icaruss7/amiees-pins/main/reel-media/reel-20261029-sterling-silver-elephant-ring.mp4"
          cover = record["queue_draft"]["media"]["cover_url"]
          ig_user, username = ig_publish.find_ig_user()

          cid = ig_publish.call(
              "POST", f"{ig_user}/media",
              media_type="REELS",
              video_url=video,
              cover_url=cover,
              caption=record["caption"],
              share_to_feed="true",
              is_ai_generated="true",
          )["id"]
          print("container", cid, flush=True)
          last = None
          for _ in range(30):
              last = ig_publish.call("GET", cid, fields="id,status_code,status")
              print(json.dumps(last, sort_keys=True), flush=True)
              if last.get("status_code") in ("FINISHED", "ERROR", "EXPIRED", "PUBLISHED"):
                  break
              time.sleep(10)
          print("account", username, ig_user)
          print("FINAL", json.dumps(last, sort_keys=True))
          if not last or last.get("status_code") != "FINISHED":
              raise RuntimeError("Exact recovery package did not reach FINISHED")
          PY
