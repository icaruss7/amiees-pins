name: Post to Instagram

on:
  schedule:
    - cron: "37 */3 * * *"     # every 3 hours, offset from the Pinterest job
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure durable checkpoints
        run: |
          git config user.name "amiees-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test publisher
        run: python3 -m unittest -v test_ig_publish

      - name: Publish anything due
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_EXPECTED_USERNAME: amiees.com_
          IG_DURABLE_GIT: '1'
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 ig_publish.py

      - name: Save what was posted
        if: always()
        run: |
          git config user.name  "amiees-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain ig_state.json)" ]; then
            git add ig_state.json
            git commit -m "Instagram posts as of $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          else
            echo "Nothing new posted."
          fi

