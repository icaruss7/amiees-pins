name: Test Instagram publisher
on:
  pull_request:
    paths: [ig_publish.py, test_ig_publish.py, '.github/workflows/instagram.yml', '.github/workflows/test-instagram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest -v test_ig_publish
      - run: DRY_RUN=1 python ig_publish.py

